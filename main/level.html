<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zwariowana Lista - Level</title>
    <link rel="stylesheet" href="./assets/css/style.css?v=1.4.3">
</head>
<body>
    <header id="hejder">
        <a href="index.html" class="header-home">Zwariowana Lista</a>
    </header>

    <nav class="page-links" aria-label="Powiązane strony">
        <a href="leaderboard.html" class="leaderboard-button">LEADERBOARD</a>
        <a href="winners.html" class="leaderboard-button">ZWYCIĘZCY LEVELA</a>
    </nav>

    <main id="level-page" class="level-page" aria-live="polite">
        <p class="level-page-message">Wczytywanie levela...</p>
    </main>

    <script src="./assets/js/shared.js?v=1.4.1"></script>
    <script>
        const LEVEL_ID = new URLSearchParams(window.location.search).get("id");
        const LEVELS_URL = LIST_PAGE_CONTEXT.levelsUrl;
        const PLAYERS_URL = LIST_PAGE_CONTEXT.playersUrl;
        const PLAYERS_FILE = PLAYERS_URL.split("/").pop();
        const THUMBNAIL_URL = "https://raw.githubusercontent.com/All-Rated-Extreme-Demon-List/Thumbnails/main/levels/cards";

        function escapeHTML(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function getLevelTags(level) {
            const value = level.Tag ?? level.tag;
            const tags = Array.isArray(value)
                ? value
                : value == null
                    ? []
                    : [value];

            return [...new Set(
                tags
                    .map(tag => String(tag ?? "").trim())
                    .filter(Boolean)
            )];
        }

        function getLevelAuthor(level) {
            const value = level.Autor ?? level.author;
            return Array.isArray(value)
                ? value.map(author => String(author).trim()).filter(Boolean)
                : value == null
                    ? []
                    : [String(value).trim()].filter(Boolean);
        }

        async function loadLevelPage() {
            const container = document.getElementById("level-page");

            try {
                if (!LEVEL_ID) {
                    throw new Error("Brakuje ID levela w adresie strony.");
                }

                const [levelsResponse, playersResponse] = await Promise.all([
                    fetch(LEVELS_URL, { cache: "no-cache" }),
                    fetch(PLAYERS_URL, { cache: "no-cache" })
                ]);

                if (!levelsResponse.ok || !playersResponse.ok) {
                    throw new Error(`Nie udało się wczytać leveli lub pliku ${PLAYERS_FILE}.`);
                }

                const [levels, players] = await Promise.all([
                    levelsResponse.json(),
                    playersResponse.json()
                ]);

                if (!Array.isArray(levels) || !Array.isArray(players)) {
                    throw new Error("Pliki leveli i graczy muszą zawierać tablice.");
                }

                const activeLevels = levels.filter(level => !isLegacyLevel(level));
                const levelIndex = activeLevels.findIndex(level =>
                    String(level.id ?? "").trim() === LEVEL_ID
                );
                const level = activeLevels[levelIndex];

                if (!level) {
                    throw new Error("Nie znaleziono levela o podanym ID.");
                }

                const levelName = String(level.name ?? "Nieznany level").trim();
                const levelNameKey = levelName.toLowerCase();
                const levelIdKey = String(level.id).trim().toLowerCase();
                const rank = levelIndex + 1;
                const victors = players
                    .filter(player =>
                        getPlayerCompletions(player).some(completion => {
                            const key = String(completion).trim().toLowerCase();
                            return key === levelNameKey || key === levelIdKey;
                        })
                    )
                    .map(player => String(player.Player ?? "").trim())
                    .filter(Boolean)
                    .sort((a, b) => a.localeCompare(b, "pl"));
                const tags = getLevelTags(level);
                const authors = getLevelAuthor(level);
                const isChallengeList = LIST_PAGE_CONTEXT.isChallengeList;

                document.title = `Zwariowana Lista - ${levelName}`;
                container.innerHTML = `
                    <aside class="level-details">
                        <div class="level-details-image">
                            <img
                                src="${THUMBNAIL_URL}/${encodeURIComponent(String(level.id))}.webp"
                                alt="${escapeHTML(levelName)}"
                            >
                            ${rank <= 150 ? `<span class="level-details-rank">#${rank}</span>` : ""}
                        </div>
                        <div class="level-details-content">
                            <h1>${escapeHTML(levelName)}</h1>
                            <dl class="level-details-list">
                                <div><dt>ID</dt><dd>${escapeHTML(level.id)}</dd></div>
                                ${rank <= 150
                                    ? `<div><dt>Pozycja</dt><dd>#${rank}</dd></div>
                                       <div><dt>Punkty</dt><dd>${getPoints(rank)} ZLP</dd></div>`
                                    : '<div><dt>Pozycja</dt><dd>Poza TOP 150</dd></div>'}
                                ${authors.length
                                    ? `<div><dt>${authors.length === 1 ? "Autor" : "Autorzy"}</dt><dd>${authors.map(escapeHTML).join(", ")}</dd></div>`
                                    : ""}
                                ${level.AddedAt || level.addedAt
                                    ? `<div><dt>Dodano</dt><dd>${escapeHTML(level.AddedAt ?? level.addedAt)}</dd></div>`
                                    : ""}
                            </dl>
                            ${tags.length
                                ? `<div class="level-details-tags" aria-label="Tagi">
                                    ${tags.map(tag => `<span class="level-details-tag">${escapeHTML(tag)}</span>`).join("")}
                                </div>`
                                : ""}
                        </div>
                    </aside>
                    <section class="level-victors-panel">
                        <h2>${isChallengeList ? "Zwycięzcy challenge'a" : "Zwycięzcy levela"}</h2>
                        <p class="level-victors-count">${victors.length} ${victors.length === 1 ? "gracz" : "graczy"}</p>
                        ${victors.length
                            ? `<ul class="level-victors-list">
                                ${victors.map(name => `<li>${escapeHTML(name)}</li>`).join("")}
                               </ul>`
                            : `<p class="level-page-message">Brak zapisanych zwycięzców tego levela.</p>`}
                    </section>
                `;

                const image = container.querySelector(".level-details-image img");
                image.addEventListener("error", () => image.remove());
            } catch (error) {
                console.error("Nie udało się wczytać strony levela:", error);
                container.innerHTML = `
                    <p class="level-page-message">
                        Nie udało się wczytać levela.
                        <br><small>${escapeHTML(error.message)}</small>
                    </p>
                `;
            }
        }

        document.addEventListener("DOMContentLoaded", loadLevelPage);
    </script>
</body>
</html>
