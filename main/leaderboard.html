<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Zwariowana Lista - Ranking graczy ZLL</title>

    <link rel="stylesheet" href="./assets/css/style.css?v=1.3.7">

</head>

<body>

    <!-- =========================
         HEADER
    ========================= -->

    <header id="hejder">

        <a href="index.html" class="header-home">Zwariowana Lista</a>

    </header>

    <nav class="page-links" aria-label="Related pages">
        <a href="recently.html" class="leaderboard-button recently-button">
            OSTATNIO WBITE!
        </a>
        <a href="winners.html" class="leaderboard-button">
            ZWYCIĘZCY LEVELA
        </a>
        <a href="compare.html" class="leaderboard-button">
            PORÓWNAJ GRACZY
        </a>
        <a href="new-levels.html" class="leaderboard-button">NOWE LEVELE!</a>
        <a href="authors.html" class="leaderboard-button">AUTOR</a>
    </nav>


    <!-- =========================
         LEADERBOARD
    ========================= -->

    <main class="leaderboard-page">

        <div class="leaderboard-title">
            RANKING GRACZY
        </div>

        <div class="leaderboard-subtitle">
            Ranking na podstawie ukończonych demonów
        </div>

        <div id="leaderboard-list">

            <div class="leaderboard-loading">
                Wczytywanie graczy...
            </div>

        </div>

    </main>
<script src="./assets/js/shared.js?v=1.3.4"></script>
<script>


// =====================================================
// USTAWIENIA
// =====================================================

const PLAYERS_URL = LIST_PAGE_CONTEXT.playersUrl;
const PLAYERS_FILE = PLAYERS_URL.split("/").pop();
const LEVELS_URL = LIST_PAGE_CONTEXT.levelsUrl;
const THUMBNAIL_URL = "https://raw.githubusercontent.com/All-Rated-Extreme-Demon-List/Thumbnails/main/levels/cards";
const LINKS_URL = "./links.json";


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

function formatDemonCount(count) {
    if (LIST_PAGE_CONTEXT.isChallengeList) {
        const lastTwoDigits = count % 100;
        const lastDigit = count % 10;
        const unit = count === 1
            ? "wyzwanie"
            : lastTwoDigits >= 12 && lastTwoDigits <= 14
                ? "wyzwań"
                : lastDigit >= 2 && lastDigit <= 4
                    ? "wyzwania"
                    : "wyzwań";

        return `${count} ${unit}`;
    }

    const lastTwoDigits = count % 100;
    const lastDigit = count % 10;

    if (count === 1) {
        return "1 demon";
    }

    if (
        lastTwoDigits < 12 ||
        lastTwoDigits > 14
    ) {
        if (lastDigit >= 2 && lastDigit <= 4) {
            return `${count} demony`;
        }
    }

    return `${count} demonów`;
}

function isNewLevel(level, firstIncludedDay, today) {
    const addedAt = level.AddedAt ?? level.addedAt;

    if (typeof addedAt !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(addedAt)) {
        return false;
    }

    const [year, month, day] = addedAt.split("-").map(Number);
    const timestamp = Date.UTC(year, month - 1, day);
    const date = new Date(timestamp);

    return date.getUTCFullYear() === year &&
        date.getUTCMonth() === month - 1 &&
        date.getUTCDate() === day &&
        timestamp >= firstIncludedDay &&
        timestamp <= today;
}


// =====================================================
// LEADERBOARD
// =====================================================

async function loadLeaderboard() {

    const container =
        document.getElementById(
            "leaderboard-list"
        );


    try {

        // =================================================
        // WCZYTUJEMY PLAYERS.JSON + LEVELS.JSON
        // =================================================

        const [
            playersResponse,
            levelsResponse,
            linksResponse
        ] = await Promise.all([

            fetch(PLAYERS_URL, {
                cache: "no-cache"
            }),

            fetch(LEVELS_URL, {
                cache: "no-cache"
            }),

            LIST_PAGE_CONTEXT.isChallengeList
                ? fetch(LINKS_URL, {
                    cache: "no-cache"
                })
                : Promise.resolve(null)

        ]);


        if (!playersResponse.ok) {
            throw new Error(
                `Nie można wczytać ${PLAYERS_FILE}`
            );
        }


        if (!levelsResponse.ok) {
            throw new Error(
                "Nie można wczytać levels.json"
            );
        }

        if (linksResponse && !linksResponse.ok) {
            throw new Error(
                `Nie można wczytać ${LINKS_URL}`
            );
        }


        const players =
            await playersResponse.json();


        const levels =
            await levelsResponse.json();

        const links = linksResponse
            ? await linksResponse.json()
            : [];


        if (!Array.isArray(players)) {
            throw new Error(
                `${PLAYERS_FILE} musi zawierać tablicę`
            );
        }


        if (!Array.isArray(levels)) {
            throw new Error(
                "levels.json musi zawierać tablicę"
            );
        }

        if (!Array.isArray(links)) {
            throw new Error(
                "links.json musi zawierać tablicę"
            );
        }

        const videoLinks = new Map();
        links.forEach((link, index) => {
            const playerName = String(link?.player ?? "").trim();
            const levelIds = Array.isArray(link?.levelId)
                ? link.levelId.map(levelId => String(levelId ?? "").trim()).filter(Boolean)
                : [String(link?.levelId ?? "").trim()].filter(Boolean);
            let videoUrl;

            try {
                videoUrl = new URL(String(link?.videoUrl ?? "").trim());
            } catch {
                console.warn(`Nieprawidłowy videoUrl w links.json (wpis ${index + 1}).`);
                return;
            }

            if (
                !playerName ||
                !levelIds.length ||
                !["http:", "https:"].includes(videoUrl.protocol)
            ) {
                console.warn(`Nieprawidłowy wpis links.json (wpis ${index + 1}).`);
                return;
            }

            levelIds.forEach(levelId => {
                const key = `${playerName.toLowerCase()}::${levelId}`;

                if (videoLinks.has(key)) {
                    console.warn(`Powielony link do wyzwania w links.json (wpis ${index + 1}).`);
                    return;
                }

                videoLinks.set(key, videoUrl.toString());
            });
        });


        const recentPlayer = players.find(player => {
            const tag = Array.isArray(player.tag) ? player.tag : [player.tag];
            return tag.some(value => String(value).toLowerCase() === "recent");
        });
        const activeLevels = levels
            .filter(level => !isLegacyLevel(level));
        const now = new Date();
        const today = Date.UTC(
            now.getUTCFullYear(),
            now.getUTCMonth(),
            now.getUTCDate()
        );
        const firstIncludedDay = today - 6 * 24 * 60 * 60 * 1000;
        const newLevelIds = new Set(
            activeLevels
                .slice(0, 150)
                .filter(level => isNewLevel(level, firstIncludedDay, today))
                .map(level => String(level.id))
        );
        const legacyNames = new Set(
            levels
                .filter(isLegacyLevel)
                .map(level => String(level.name).trim().toLowerCase())
        );
        const recentLevel = recentPlayer?.recent && activeLevels.find(level =>
            String(level.name).trim().toLowerCase() ===
            String(recentPlayer.recent).trim().toLowerCase()
        );
        const recentlyButton = document.querySelector(".recently-button");

        if (recentLevel && recentlyButton) {
            recentlyButton.style.backgroundImage = `linear-gradient(rgba(0, 35, 0, 0.42), rgba(0, 20, 0, 0.78)), url("${THUMBNAIL_URL}/${recentLevel.id}.webp")`;
            recentlyButton.title = `${recentPlayer.Player} ostatnio ukończył(a): ${recentLevel.name}`;
        }


        // =================================================
        // TWORZYMY MAPĘ DEMON -> RANK
        // =================================================

        const demonMap = {};
        const levelMap = {};


        activeLevels
            .forEach((level, index) => {

                const rank =
                    index + 1;


                if (!level.name) {
                    return;
                }


                const name =
                    String(level.name)
                        .trim()
                        .toLowerCase();


                if (index < 150) {
                    demonMap[name] =
                        rank;
                    if (level.id !== undefined && level.id !== null) {
                        const id = String(level.id).trim();
                        if (!(id in demonMap)) {
                            demonMap[id] = rank;
                        }
                    }
                    if (level.id !== undefined && level.id !== null) {
                        const id = String(level.id).trim();
                        if (!(id in demonMap)) {
                            demonMap[id] = rank;
                        }
                    }
                }

                levelMap[name] = {
                    level,
                    rank
                };
                if (level.id !== undefined && level.id !== null) {
                    const id = String(level.id).trim();
                    if (!(id in levelMap)) {
                        levelMap[id] = {
                            level,
                            rank
                        };
                    }
                }
                if (level.id !== undefined && level.id !== null) {
                    const id = String(level.id).trim();
                    if (!(id in levelMap)) {
                        levelMap[id] = {
                            level,
                            rank
                        };
                    }
                }

            });


        console.log(
            "Demony z levels.json:",
            demonMap
        );


        // =================================================
        // LICZENIE PLAYERÓW
        // =================================================

        const leaderboard =
            players.map(player => {

                let totalPoints = 0;

                let completed = 0;

                let bestRank = Infinity;

                let top10 = 0;

                let top25 = 0;

                let top50 = 0;


                // -----------------------------------------
                // DEMONY GRACZA
                // -----------------------------------------

                const playerDemons = getPlayerCompletions(player)
                    .filter(demonName =>
                        !legacyNames.has(String(demonName).trim().toLowerCase())
                    );


                playerDemons.forEach(
                    demonName => {

                        if (!demonName) {
                            return;
                        }


                        const key =
                            String(demonName)
                                .trim()
                                .toLowerCase();


                        const rank =
                            demonMap[key];


                        // ---------------------------------
                        // DEMON NIE JEST NA LIŚCIE
                        // ---------------------------------

                        if (!rank) {

                            console.warn(
                                `Nie znaleziono "${demonName}" w levels.json`
                            );

                            return;

                        }


                        // ---------------------------------
                        // PUNKTY
                        // ---------------------------------

                        const points =
                            getPoints(rank);


                        totalPoints += points;

                        completed++;


                        // ---------------------------------
                        // BEST
                        // ---------------------------------

                        if (rank < bestRank) {

                            bestRank =
                                rank;

                        }


                        // ---------------------------------
                        // TOP 10
                        // ---------------------------------

                        if (rank <= 10) {

                            top10++;

                        }


                        // ---------------------------------
                        // TOP 25
                        // ---------------------------------

                        if (rank <= 25) {

                            top25++;

                        }


                        // ---------------------------------
                        // TOP 50
                        // ---------------------------------

                        if (rank <= 50) {

                            top50++;

                        }

                    }
                );


                const playerName = String(player.Player || "").trim();

                return {

                    name:
                        playerName,

                    points:
                        totalPoints,

                    completed:
                        completed,

                    bestRank:
                        bestRank === Infinity
                            ? "-"
                            : bestRank,

                    top10:
                        top10,

                    top25:
                        top25,

                    top50:
                        top50,

                    demons:
                        playerDemons
                            .map(demonName => {
                                const name = String(demonName).trim();
                                const demon = levelMap[name.toLowerCase()] ||
                                    levelMap[name];

                                return {
                                    name: demon?.level.name || name,
                                    rank: demon?.rank,
                                    id: demon?.level.id,
                                    author: demon?.level.Autor,
                                    isNew: demon?.level.id != null &&
                                        newLevelIds.has(String(demon.level.id)),
                                    videoUrl: LIST_PAGE_CONTEXT.isChallengeList && demon?.level.id != null
                                        ? videoLinks.get(`${playerName.toLowerCase()}::${String(demon.level.id).trim()}`)
                                        : null
                                };
                            })

                };

            });


        // =================================================
        // SORTOWANIE
        // =================================================

        leaderboard.sort(
            (a, b) => {

                // Najpierw punkty
                if (
                    b.points !==
                    a.points
                ) {

                    return (
                        b.points -
                        a.points
                    );

                }


                // Potem liczba demonów
                if (
                    b.completed !==
                    a.completed
                ) {

                    return (
                        b.completed -
                        a.completed
                    );

                }


                // Na końcu najlepszy rank
                return (
                    (a.bestRank === "-"
                        ? 999
                        : a.bestRank
                    )
                    -
                    (b.bestRank === "-"
                        ? 999
                        : b.bestRank
                    )
                );

            }
        );


        // =================================================
        // WYŚWIETLANIE
        // =================================================

        container.innerHTML = "";


        leaderboard.forEach(
            (player, index) => {

                const entry =
                    document.createElement("div");

                entry.className =
                    "leaderboard-entry";

                const row =
                    document.createElement("button");

                const detailsId =
                    `player-demons-${index}`;

                row.type =
                    "button";

                row.className =
                    "leaderboard-row";

                row.setAttribute("aria-expanded", "false");

                row.setAttribute("aria-controls", detailsId);

                row.innerHTML = `

                    <span class="leaderboard-position">
                        #${index + 1}
                    </span>


                    <span class="leaderboard-player">

                        <span class="leaderboard-player-name">
                            ${escapeHTML(player.name)}
                        </span>

                        <span class="leaderboard-player-stats">
                            ${formatDemonCount(player.completed)} · Hardest: ${player.bestRank}
                        </span>
                    </span>


                    <span class="leaderboard-tops">

                        <span>
                            TOP 10:
                            ${player.top10}
                        </span>

                        <span>
                            TOP 25:
                            ${player.top25}
                        </span>

                        <span>
                            TOP 50:
                            ${player.top50}
                        </span>

                    </span>


                    <span class="leaderboard-points">
                        ${player.points} <small>ZLP</small>
                    </span>

                `;

                const details =
                    document.createElement("div");

                details.id =
                    detailsId;

                details.className =
                    "leaderboard-demons";

                details.hidden =
                    true;

                const demonCards = player.demons
                    .sort((a, b) => {
                        if (a.rank == null) {
                            return b.rank == null ? 0 : 1;
                        }

                        if (b.rank == null) {
                            return -1;
                        }

                        return a.rank - b.rank;
                    })
                    .map(demon => `
                    ${demon.videoUrl
                        ? `<a class="leaderboard-demon leaderboard-demon-link" href="${escapeHTML(demon.videoUrl)}" target="_blank" rel="noopener noreferrer" title="Otwórz wideo ukończenia: ${escapeHTML(demon.name)}">`
                        : `<div class="leaderboard-demon">`}
                        ${demon.id
                            ? `<img src="${THUMBNAIL_URL}/${encodeURIComponent(String(demon.id))}.webp" alt="" loading="lazy">`
                            : ""}
                        <span class="leaderboard-demon-info">
                            <span class="leaderboard-demon-name">${escapeHTML(demon.name)}</span>
                            <span class="leaderboard-demon-meta">
                                ${demon.id ? `ID: ${escapeHTML(demon.id)}` : ""}
                                ${demon.author
                                    ? ` · Autor: ${escapeHTML(Array.isArray(demon.author) ? demon.author.join(", ") : demon.author)}`
                                    : ""}
                            </span>
                        </span>
                        <span class="leaderboard-demon-rank">
                            ${demon.rank ? `#${demon.rank}` : "Poza rankingiem"}
                            ${demon.isNew ? '<span class="leaderboard-demon-new">NEW</span>' : ""}
                        </span>
                    ${demon.videoUrl ? "</a>" : "</div>"}
                `).join("");

                details.innerHTML = player.demons.length
                    ? `
                        <div class="leaderboard-demons-title">
                            Ukończone ${LIST_PAGE_CONTEXT.isChallengeList ? "wyzwania" : "demony"} gracza ${escapeHTML(player.name)}
                        </div>
                        <div class="leaderboard-demons-list">
                            ${demonCards}
                        </div>
                    `
                    : `<div class="leaderboard-demons-empty">Brak zapisanych ${LIST_PAGE_CONTEXT.isChallengeList ? "wyzwań" : "demonów"}.</div>`;

                row.addEventListener("click", () => {
                    const isExpanded =
                        row.getAttribute("aria-expanded") === "true";

                    row.setAttribute(
                        "aria-expanded",
                        String(!isExpanded)
                    );

                    details.hidden =
                        isExpanded;
                });

                entry.append(row, details);
                container.appendChild(entry);

            }
        );


        console.log(
            "Leaderboard załadowany poprawnie."
        );

    }


    catch (error) {

        console.error(
            "Błąd leaderboardu:",
            error
        );


        container.innerHTML = `

            <div class="leaderboard-loading">

                Błąd podczas ładowania rankingu.

                <br><br>

                <small>
                    ${escapeHTML(error.message)}
                </small>

            </div>

        `;

    }

}


// =====================================================
// START
// =====================================================

if (LIST_PAGE_CONTEXT.isChallengeList) {
    document.title = "Zwariowana Lista - Ranking graczy ZCL";
    document.querySelector(".leaderboard-subtitle").textContent =
        "Ranking na podstawie ukończonych wyzwań";
}

document.addEventListener(
    "DOMContentLoaded",
    () => {

        loadLeaderboard();

    }
);

</script>
</body>
</html>
