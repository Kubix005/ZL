<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zwariowana Lista - Porównaj graczy</title>
    <link rel="stylesheet" href="./assets/css/style.css?v=1.4.6">
</head>
<body class="compare-body">
    <header id="hejder">
        <a href="index.html" class="header-home">Zwariowana Lista</a>
    </header>

    <nav class="page-links" aria-label="Powiązane strony">
        <a href="leaderboard.html" class="leaderboard-button">RANKING GRACZY</a>
        <a href="recently.html" class="leaderboard-button recently-button">OSTATNIO WBITE</a>
        <a href="new-levels.html" class="leaderboard-button">NOWE LEVELE!</a>
        <a href="authors.html" class="leaderboard-button">AUTOR</a>
    </nav>

    <main class="compare-page">
        <h1 class="compare-title">PORÓWNAJ GRACZY</h1>

        <div class="compare-controls">
            <section class="compare-team" aria-labelledby="team-a-heading">
                <h2 id="team-a-heading">Zespół A</h2>
                <div id="team-a-players" class="compare-team-players"></div>
                <button id="team-a-add" class="compare-add-player" type="button" disabled>
                    + Dodaj gracza
                </button>
            </section>
            <span class="compare-versus" aria-hidden="true">VS</span>
            <section class="compare-team" aria-labelledby="team-b-heading">
                <h2 id="team-b-heading">Zespół B</h2>
                <div id="team-b-players" class="compare-team-players"></div>
                <button id="team-b-add" class="compare-add-player" type="button" disabled>
                    + Dodaj gracza
                </button>
            </section>
        </div>

        <div class="compare-view-switch" role="group" aria-label="Widok porównania">
            <button
                id="compare-points-button"
                class="compare-view-button"
                type="button"
                aria-pressed="true"
                disabled
            >PORÓWNAJ PUNKTY</button>
            <button
                id="compare-shared-button"
                class="compare-view-button"
                type="button"
                aria-pressed="false"
                disabled
            >CO RAZEM WBILI</button>
        </div>

        <section id="compare-result" class="compare-result" aria-live="polite">
            <p class="compare-message">Wczytywanie punktów...</p>
        </section>
    </main>

    <script src="./assets/js/shared.js?v=1.5.0"></script>
    <script>
        const PLAYERS_URL = LIST_PAGE_CONTEXT.playersUrl;
        const LEVELS_URL = LIST_PAGE_CONTEXT.levelsUrl;
        const PACKS_URL = "./lists/challenge/packs.json";

        const teamPlayerContainers = {
            a: document.getElementById("team-a-players"),
            b: document.getElementById("team-b-players")
        };
        const addPlayerButtons = {
            a: document.getElementById("team-a-add"),
            b: document.getElementById("team-b-add")
        };
        const pointsButton = document.getElementById("compare-points-button");
        const sharedButton = document.getElementById("compare-shared-button");
        const resultContainer = document.getElementById("compare-result");
        let ranksByName = new Map();
        let showAlternativePlans = false;
        let comparisonView = "points";
        const teamPlayerIds = { a: [], b: [] };

        function renderTeamControls(players, demonPool, allLevelPool) {
            const selectedIds = new Set([
                ...teamPlayerIds.a,
                ...teamPlayerIds.b
            ]);

            ["a", "b"].forEach(side => {
                const container = teamPlayerContainers[side];
                container.replaceChildren();

                teamPlayerIds[side].forEach((playerId, rowIndex) => {
                    const row = document.createElement("div");
                    row.className = "compare-team-player";

                    const select = document.createElement("select");
                    select.setAttribute(
                        "aria-label",
                        `Gracz ${side.toUpperCase()} ${rowIndex + 1}`
                    );

                    players.forEach((player, index) => {
                        if (selectedIds.has(index) && index !== playerId) {
                            return;
                        }

                        const option = document.createElement("option");
                        option.value = String(index);
                        option.textContent =
                            `${player.name} — ${player.points.toLocaleString("pl-PL")} ZLP`;
                        option.selected = index === playerId;
                        select.appendChild(option);
                    });

                    select.addEventListener("change", () => {
                        teamPlayerIds[side][rowIndex] = Number(select.value);
                        renderTeamControls(players, demonPool, allLevelPool);
                        renderComparison(players, demonPool, allLevelPool);
                    });

                    const removeButton = document.createElement("button");
                    removeButton.className = "compare-remove-player";
                    removeButton.type = "button";
                    removeButton.textContent = "Usuń";
                    removeButton.setAttribute(
                        "aria-label",
                        `Usuń gracza ${players[playerId].name} z zespołu ${side.toUpperCase()}`
                    );
                    removeButton.disabled = teamPlayerIds[side].length === 1;
                    removeButton.addEventListener("click", () => {
                        teamPlayerIds[side].splice(rowIndex, 1);
                        renderTeamControls(players, demonPool, allLevelPool);
                        renderComparison(players, demonPool, allLevelPool);
                    });

                    row.append(select, removeButton);
                    container.appendChild(row);
                });

                const hasAvailablePlayers = players.some((player, index) =>
                    !selectedIds.has(index)
                );
                addPlayerButtons[side].disabled = !hasAvailablePlayers;
            });

            const canCompare =
                teamPlayerIds.a.length > 0 && teamPlayerIds.b.length > 0;
            pointsButton.disabled = !canCompare;
            sharedButton.disabled = !canCompare;
        }

        function addPlayerToTeam(side, players, demonPool, allLevelPool) {
            const selectedIds = new Set([
                ...teamPlayerIds.a,
                ...teamPlayerIds.b
            ]);
            const availablePlayerId = players.findIndex(
                (player, index) => !selectedIds.has(index)
            );

            if (availablePlayerId === -1) {
                return;
            }

            teamPlayerIds[side].push(availablePlayerId);
            renderTeamControls(players, demonPool, allLevelPool);
            renderComparison(players, demonPool, allLevelPool);
        }

        function getLevelTags(level) {
            const value = level.Tag ?? level.tag;
            const tags = Array.isArray(value)
                ? value
                : value == null
                    ? []
                    : [value];

            return [...new Set(
                tags
                    .map(tag => String(tag ?? "").trim().toLowerCase())
                    .filter(Boolean)
            )];
        }

        function getPlayerTagCounts(player, demonPool) {
            const completedDemons = new Set(
                player.demons.map(name => String(name).trim().toLowerCase())
            );
            const tagCounts = new Map();

            demonPool
                .filter(demon => completedDemons.has(demon.name.toLowerCase()))
                .forEach(demon => {
                    demon.tags.forEach(tag => {
                        tagCounts.set(tag, (tagCounts.get(tag) || 0) + 1);
                    });
                });

            return tagCounts;
        }

        function getTagAffinity(demon, tagCounts) {
            return demon.tags.reduce(
                (score, tag) => score + (tagCounts.get(tag) || 0),
                0
            );
        }

        function getCatchUpPlan(player, pointDifference, demonPool) {
            const completedDemons = new Set(
                player.demons.map(name => String(name).trim().toLowerCase())
            );
            const tagCounts = getPlayerTagCounts(player, demonPool);
            const availableDemons = demonPool.filter(
                demon => !completedDemons.has(demon.name.toLowerCase())
            );
            const demons = availableDemons
                .sort((a, b) =>
                    getTagAffinity(b, tagCounts) - getTagAffinity(a, tagCounts) ||
                    b.points - a.points ||
                    a.rank - b.rank
                );
            const chosenDemons = [];
            let netPoints = 0;

            for (const demon of demons) {
                if (netPoints >= pointDifference) {
                    break;
                }

                chosenDemons.push(demon);
                netPoints += demon.points;
            }

            return chosenDemons.length
                ? { count: chosenDemons.length, demons: chosenDemons, netPoints }
                : null;
        }

        function getAlternativePlan(player, comparedPlayer, pointDifference, demonPool) {
            const completedDemons = new Set(
                [player, comparedPlayer].flatMap(completedPlayer =>
                    completedPlayer.demons.map(name =>
                        String(name).trim().toLowerCase()
                    )
                )
            );
            const availableDemons = demonPool.filter(
                demon => !completedDemons.has(demon.name.toLowerCase())
            );
            const tagCounts = getPlayerTagCounts(player, demonPool);
            const completedRanks = player.demons
                .map(name => ranksByName.get(String(name).trim().toLowerCase()))
                .filter(Number.isInteger);
            const bestRank = completedRanks.length
                ? Math.min(...completedRanks)
                : null;

            availableDemons.sort((a, b) => {
                const tagAffinityDifference =
                    getTagAffinity(b, tagCounts) - getTagAffinity(a, tagCounts);

                if (tagAffinityDifference !== 0) {
                    return tagAffinityDifference;
                }

                if (bestRank === null) {
                    return b.rank - a.rank;
                }

                const aIsHarder = a.rank < bestRank;
                const bIsHarder = b.rank < bestRank;

                if (aIsHarder !== bIsHarder) {
                    return aIsHarder ? -1 : 1;
                }

                return aIsHarder
                    ? b.rank - a.rank
                    : a.rank - b.rank;
            });

            const demons = [];
            let totalPoints = 0;

            for (const demon of availableDemons) {
                if (totalPoints >= pointDifference) {
                    break;
                }

                demons.push(demon);
                totalPoints += demon.points;
            }

            return demons.length
                ? { count: demons.length, demons, totalPoints }
                : null;
        }

        function getSharedCompletionLabel(count) {
            if (LIST_PAGE_CONTEXT.isChallengeList) {
                const lastTwoDigits = count % 100;
                const lastDigit = count % 10;

                if (count === 1) {
                    return "wyzwanie";
                }

                return lastDigit >= 2 && lastDigit <= 4 &&
                    (lastTwoDigits < 12 || lastTwoDigits > 14)
                    ? "wyzwania"
                    : "wyzwań";
            }

            if (count === 1) {
                return "level";
            }

            return count >= 2 && count <= 4 ? "levele" : "leveli";
        }

        function createTeam(side, players) {
            const members = teamPlayerIds[side]
                .map(playerId => players[playerId])
                .filter(Boolean);

            if (members.length === 0) {
                return null;
            }

            return {
                name: members.map(player => player.name).join(" + "),
                points: members.reduce((total, player) => total + player.points, 0),
                packPoints: members.reduce(
                    (total, player) => total + player.packPoints,
                    0
                ),
                demons: [...new Set(members.flatMap(player => player.demons))],
                members
            };
        }

        function getRecommendationLabel(count) {
            if (LIST_PAGE_CONTEXT.isChallengeList) {
                const lastTwoDigits = count % 100;
                const lastDigit = count % 10;

                if (count === 1) {
                    return "wyzwanie";
                }

                return lastDigit >= 2 && lastDigit <= 4 &&
                    (lastTwoDigits < 12 || lastTwoDigits > 14)
                    ? "wyzwania"
                    : "wyzwań";
            }

            if (count === 1) {
                return "demon";
            }

            return count >= 2 && count <= 4 ? "demony" : "demonów";
        }

        function renderComparison(players, demonPool, allLevelPool) {
            const teamA = createTeam("a", players);
            const teamB = createTeam("b", players);

            if (!teamA || !teamB) {
                const hasEnoughPlayers = players.length >= 2;
                resultContainer.innerHTML = `
                    <p class="compare-message">
                        ${hasEnoughPlayers
                            ? "Dodaj co najmniej jednego gracza do każdego zespołu."
                            : `Do porównania potrzeba co najmniej dwóch różnych graczy. Ta lista ma obecnie ${players.length}. Dodaj kolejnych w pliku ${LIST_PAGE_CONTEXT.isChallengeList ? "challenge-players.json" : "players.json"}.`}
                    </p>
                `;
                return;
            }

            if (comparisonView === "shared") {
                const teamACompletions = new Set(teamA.demons.map(name => name.toLowerCase()));
                const teamBCompletions = new Set(teamB.demons.map(name => name.toLowerCase()));
                const sharedLevels = allLevelPool.filter(level =>
                    teamACompletions.has(level.name.toLowerCase()) &&
                    teamBCompletions.has(level.name.toLowerCase())
                );

                resultContainer.innerHTML = sharedLevels.length
                    ? `
                        <div class="compare-shared-heading">
                            <h2>Wspólne ukończenia</h2>
                            <strong>${sharedLevels.length} ${getSharedCompletionLabel(sharedLevels.length)}</strong>
                        </div>
                        <ol class="compare-shared-list">
                            ${sharedLevels.map(level => `
                                <li>
                                    <span class="compare-shared-rank">#${level.rank}</span>
                                    <span>${escapeHTML(level.name)}</span>
                                </li>
                            `).join("")}
                        </ol>
                    `
                    : `
                        <div class="compare-shared-heading">
                            <h2>Wspólne ukończenia</h2>
                        </div>
                        <p class="compare-message">
                            Zespół A (${escapeHTML(teamA.name)}) i zespół B
                            (${escapeHTML(teamB.name)}) nie mają wspólnych ukończeń na tej liście.
                        </p>
                    `;
                return;
            }

            const difference = Math.abs(teamA.points - teamB.points);

            let catchUpMarkup = "";

            if (difference > 0) {
                const trailingTeam = teamA.points < teamB.points ? teamA : teamB;
                const leadingTeam = trailingTeam === teamA ? teamB : teamA;
                const trailingSide = trailingTeam === teamA ? "A" : "B";
                const catchUpPlan =
                    getCatchUpPlan(trailingTeam, difference, demonPool);
                const alternativePlan =
                    getAlternativePlan(
                        trailingTeam,
                        leadingTeam,
                        difference,
                        demonPool
                    );
                const hasCompletedTags =
                    getPlayerTagCounts(trailingTeam, demonPool).size > 0;
                const displayedPlan = showAlternativePlans
                    ? alternativePlan
                    : catchUpPlan;
                const displayedPlans = displayedPlan
                    ? [[displayedPlan.count, displayedPlan]]
                    : [];
                const planCards = displayedPlans.map(([count, plan]) => `
                    <article class="catch-up-option">
                        <h3>${count} ${getRecommendationLabel(count)}</h3>
                        <strong class="catch-up-total">+${(showAlternativePlans ? plan.totalPoints : plan.netPoints).toLocaleString("pl-PL")} ZLP</strong>
                        <ol class="catch-up-list">
                            ${plan.demons.map(demon => `
                                <li>
                                    <span class="catch-up-rank">#${demon.rank}</span>
                                    <span class="catch-up-name">${escapeHTML(demon.name)}</span>
                                    <strong>+${demon.points.toLocaleString("pl-PL")} ZLP</strong>
                                </li>
                            `).join("")}
                        </ol>
                    </article>
                `).join("");
                const recommendationContent = planCards ||
                    `<p class="compare-message">Brak dostępnych ${LIST_PAGE_CONTEXT.isChallengeList ? "wyzwań" : "demonów"}.</p>`;

                catchUpMarkup = `
                    <div class="catch-up-plan">
                        <div class="catch-up-heading">
                            <h2>Propozycje dla zespołu ${trailingSide}</h2>
                            <button
                                class="catch-up-toggle"
                                type="button"
                                aria-pressed="${showAlternativePlans}"
                            >${showAlternativePlans ? "Pokaż najszybsze nadrabianie" : "Pokaż alternatywną strategię"}</button>
                        </div>
                        ${hasCompletedTags
                            ? '<p class="compare-tag-note">Propozycje uwzględniają tagi leveli ukończonych przez zespół.</p>'
                            : ""}
                        <div class="catch-up-options">${recommendationContent}</div>
                    </div>
                `;
            } else {
                catchUpMarkup = `
                    <div class="catch-up-plan">
                        <h2>Remis!</h2>
                    </div>
                `;
            }

            resultContainer.innerHTML = `
                <div class="compare-player-score">
                    <span>Zespół A: ${escapeHTML(teamA.name)}</span>
                    <strong>${teamA.points.toLocaleString("pl-PL")} ZLP
                        ${LIST_PAGE_CONTEXT.isChallengeList && teamA.packPoints
                            ? `<small>W tym paczki: ${teamA.packPoints.toLocaleString("pl-PL")} ZLP</small>`
                            : ""}
                    </strong>
                </div>
                <div class="compare-difference">
                    <span>${difference === 0
                        ? "Wynik"
                        : `Przewaga zespołu ${teamA.points > teamB.points ? "A" : "B"}`}</span>
                    <strong>${difference === 0 ? "0 ZLP" : `${difference.toLocaleString("pl-PL")} ZLP`}</strong>
                </div>
                <div class="compare-player-score">
                    <span>Zespół B: ${escapeHTML(teamB.name)}</span>
                    <strong>${teamB.points.toLocaleString("pl-PL")} ZLP
                        ${LIST_PAGE_CONTEXT.isChallengeList && teamB.packPoints
                            ? `<small>W tym paczki: ${teamB.packPoints.toLocaleString("pl-PL")} ZLP</small>`
                            : ""}
                    </strong>
                </div>
                ${LIST_PAGE_CONTEXT.isChallengeList
                    ? '<p class="compare-pack-note">Punkty paczek są doliczane automatycznie po ukończeniu wszystkich leveli w paczce. Propozycje nadrabiania pokazują punkty leveli, bez przyszłych bonusów paczkowych.</p>'
                    : ""}
                ${catchUpMarkup}
            `;

            const toggleButton =
                resultContainer.querySelector(".catch-up-toggle");

            if (toggleButton) {
                toggleButton.addEventListener("click", () => {
                    showAlternativePlans = !showAlternativePlans;
                    renderComparison(players, demonPool, allLevelPool);
                });
            }
        }

        function escapeHTML(text) {
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        async function loadComparison() {
            try {
                const [playersResponse, levelsResponse, packsResponse] = await Promise.all([
                    fetch(PLAYERS_URL, { cache: "no-cache" }),
                    fetch(LEVELS_URL, { cache: "no-cache" }),
                    LIST_PAGE_CONTEXT.isChallengeList
                        ? fetch(PACKS_URL, { cache: "no-cache" })
                        : Promise.resolve(null)
                ]);

                if (
                    !playersResponse.ok ||
                    !levelsResponse.ok
                ) {
                    throw new Error("Nie udało się wczytać danych graczy lub demonów.");
                }

                if (LIST_PAGE_CONTEXT.isChallengeList && !packsResponse.ok) {
                    throw new Error(`Nie można wczytać ${PACKS_URL}.`);
                }

                const [playersData, levelsData, packsData] = await Promise.all([
                    playersResponse.json(),
                    levelsResponse.json(),
                    LIST_PAGE_CONTEXT.isChallengeList
                        ? packsResponse.json()
                        : Promise.resolve([])
                ]);

                if (
                    !Array.isArray(playersData) ||
                    !Array.isArray(levelsData) ||
                    !Array.isArray(packsData)
                ) {
                    throw new Error("Dane graczy, leveli lub paczek mają nieprawidłowy format.");
                }

                const allActiveLevels = levelsData.filter(level => !isLegacyLevel(level));
                const activeLevelCount = allActiveLevels.length;
                const allLevelPool = allActiveLevels.map((level, index) => ({
                    name: String(level.name).trim(),
                    rank: index + 1
                }));
                const demonPool = allActiveLevels
                    .slice(0, 150)
                    .map((level, index) => ({
                        name: String(level.name).trim(),
                        id: level.id == null ? null : String(level.id).trim(),
                        tags: getLevelTags(level),
                        rank: index + 1,
                        points: getPoints(index + 1, activeLevelCount)
                    }));
                const namesByIdentifier = new Map();
                ranksByName = new Map();

                allActiveLevels.forEach(level => {
                    const name = String(level.name).trim();
                    const nameKey = name.toLowerCase();
                    namesByIdentifier.set(nameKey, name);

                    if (level.id != null) {
                        const idKey = String(level.id).trim().toLowerCase();

                        if (!namesByIdentifier.has(idKey)) {
                            namesByIdentifier.set(idKey, name);
                        }
                    }
                });

                demonPool.forEach(demon => {
                    const nameKey = demon.name.toLowerCase();
                    ranksByName.set(nameKey, demon.rank);

                    if (demon.id && !ranksByName.has(demon.id.toLowerCase())) {
                        ranksByName.set(demon.id.toLowerCase(), demon.rank);
                    }
                });

                const players = playersData.map(player => {
                    const demons = [...new Set(
                        getPlayerCompletions(player).map(demonName => {
                            const name = String(demonName).trim();
                            return namesByIdentifier.get(name.toLowerCase()) || name;
                        })
                    )];
                    const points = demons.reduce((total, demonName) => {
                        if (!demonName) {
                            return total;
                        }

                        const rank = ranksByName.get(String(demonName).trim().toLowerCase());
                        return total + (rank ? getPoints(rank, activeLevelCount) : 0);
                    }, 0);
                    const packs = LIST_PAGE_CONTEXT.isChallengeList
                        ? getPlayerPackStatuses(player, packsData, levelsData)
                            .filter(pack => pack.completed)
                        : [];
                    const packPoints = packs.reduce(
                        (total, pack) => total + pack.points,
                        0
                    );

                    return {
                        name: String(player.Player || "Nieznany gracz"),
                        points: points + packPoints,
                        packPoints,
                        packs,
                        demons
                    };
                }).sort((a, b) =>
                    b.points - a.points || a.name.localeCompare(b.name, "pl")
                );

                if (players.length === 0) {
                    throw new Error("Nie znaleziono żadnych graczy na tej liście.");
                }

                teamPlayerIds.a = [0];
                teamPlayerIds.b = players.length > 1 ? [1] : [];
                renderTeamControls(players, demonPool, allLevelPool);
                addPlayerButtons.a.addEventListener("click", () =>
                    addPlayerToTeam("a", players, demonPool, allLevelPool)
                );
                addPlayerButtons.b.addEventListener("click", () =>
                    addPlayerToTeam("b", players, demonPool, allLevelPool)
                );
                pointsButton.addEventListener("click", () => {
                    comparisonView = "points";
                    pointsButton.setAttribute("aria-pressed", "true");
                    sharedButton.setAttribute("aria-pressed", "false");
                    renderComparison(players, demonPool, allLevelPool);
                });
                sharedButton.addEventListener("click", () => {
                    comparisonView = "shared";
                    pointsButton.setAttribute("aria-pressed", "false");
                    sharedButton.setAttribute("aria-pressed", "true");
                    renderComparison(players, demonPool, allLevelPool);
                });
                renderComparison(players, demonPool, allLevelPool);
            } catch (error) {
                console.error("Błąd porównywania graczy:", error);
                addPlayerButtons.a.disabled = true;
                addPlayerButtons.b.disabled = true;
                pointsButton.disabled = true;
                sharedButton.disabled = true;
                resultContainer.innerHTML = `
                    <p class="compare-message">
                        Nie udało się wczytać porównania.
                        <br><small>${escapeHTML(error.message)}</small>
                    </p>
                `;
            }
        }

        if (LIST_PAGE_CONTEXT.isChallengeList) {
            document.title = "Zwariowana Lista - Porównaj graczy ZCL";
        }
        document.addEventListener("DOMContentLoaded", loadComparison);
    </script>
</body>
</html>
